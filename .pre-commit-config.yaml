# Run `pre-commit install` once after cloning to enable local secret scanning
# on every commit. CI runs the same scan via .github/workflows/gitleaks.yml.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    # Pinned to the gitleaks release verified against this repo (2025-era
    # stable). Bump with `pre-commit autoupdate` as new releases ship.
    rev: v8.30.1
    hooks:
      - id: gitleaks
